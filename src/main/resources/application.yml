discovery:
  portOptions: No, Yes
  supportedTypes: IP, Range, Subnet
  probe:
    # Bounds on a single target probe. connect-timeout-ms bounds the TCP handshake; read-timeout-ms bounds
    # the TLS handshake and the certificate read, which are otherwise unbounded and can hold a scanner
    # thread indefinitely against a host that accepts and then stalls.
    connect-timeout-ms: ${DISCOVERY_PROBE_CONNECT_TIMEOUT_MS:300}
    read-timeout-ms: ${DISCOVERY_PROBE_READ_TIMEOUT_MS:2000}
server:
  port: ${PORT:8080}
spring:
  datasource:
    auto-commit: false
    driver-class-name: org.postgresql.Driver
    password: ${JDBC_PASSWORD}
    url: ${JDBC_URL}
    username: ${JDBC_USERNAME}
  flyway:
    out-of-order: true
    table: "network_schema_history"
    schemas: ${DB_SCHEMA:network}
  jpa:
    properties:
      hibernate.default_schema: ${DB_SCHEMA:network}
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      base-path: '/'
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
