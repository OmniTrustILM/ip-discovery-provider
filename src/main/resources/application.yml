discovery:
  portOptions: No, Yes
  supportedTypes: IP, Range, Subnet
  probe:
    # Bounds on a single target probe; all three must be positive, since zero means an unbounded wait.
    # connect-timeout-ms bounds the TCP handshake, which completes one round trip after the SYN, so 500 ms covers
    # any terrestrial path. Not higher: Linux retransmits a lost SYN at one second, so a budget near that pays for
    # the retransmit without ever clearing it, and every unreachable address in a sweep waits out the whole value.
    # read-timeout-ms bounds inactivity between reads.
    # total-timeout-ms bounds the whole handshake, which the other two do not: a peer trickling a byte just
    # inside the read timeout would otherwise hold the probe -- and, through the scan's batch wait, the whole
    # scan -- indefinitely.
    connect-timeout-ms: ${DISCOVERY_PROBE_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${DISCOVERY_PROBE_READ_TIMEOUT_MS:2000}
    total-timeout-ms: ${DISCOVERY_PROBE_TOTAL_TIMEOUT_MS:10000}
  slice:
    # Bounds on one Discovery v2 results call. All must be positive.
    # scan-budget-ms is how long a slice keeps launching probes; each launched probe then runs to its own
    # total-timeout-ms. The two together must not exceed 18000, so the call answers inside the 20 s Core allows it.
    # max-concurrent caps the slices this node scans at once; beyond it a results call answers 503 and Core retries.
    # max-abandoned-probes caps probe threads still blocked past their deadline, such as a host-name lookup the JVM
    # cannot interrupt; beyond it a results call answers 503 until they drain.
    scan-budget-ms: ${DISCOVERY_SLICE_SCAN_BUDGET_MS:8000}
    max-concurrent: ${DISCOVERY_SLICE_MAX_CONCURRENT:32}
    max-abandoned-probes: ${DISCOVERY_SLICE_MAX_ABANDONED_PROBES:256}
  buffer:
    # The undrained results of the live runs on this node. Production blocks when a bound is reached rather than
    # dropping items, which is safe because Core drains from initiate onward; a wait longer than
    # backpressure-wait-ms fails the run naming the bound it hit. All must be positive.
    max-runs: ${DISCOVERY_BUFFER_MAX_RUNS:8}
    max-items-per-run: ${DISCOVERY_BUFFER_MAX_ITEMS_PER_RUN:50000}
    max-bytes-per-run: ${DISCOVERY_BUFFER_MAX_BYTES_PER_RUN:134217728}
    max-total-bytes: ${DISCOVERY_BUFFER_MAX_TOTAL_BYTES:536870912}
    backpressure-wait-ms: ${DISCOVERY_BUFFER_BACKPRESSURE_WAIT_MS:120000}
  run:
    # The connector's own deadline, measured as time since the platform last drove the run. Core's cleanup after a
    # failed start is best-effort, so without this an orphaned scan holds its buffer and threads until a restart.
    idle-deadline-ms: ${DISCOVERY_RUN_IDLE_DEADLINE_MS:1800000}
    reaper-interval-ms: ${DISCOVERY_RUN_REAPER_INTERVAL_MS:60000}
server:
  port: ${PORT:8080}
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${JDBC_PASSWORD}
    url: ${JDBC_URL}
    username: ${JDBC_USERNAME}
  flyway:
    out-of-order: true
    table: "network_schema_history"
    schemas: ${DB_SCHEMA:network}
  jpa:
    properties:
      hibernate.default_schema: ${DB_SCHEMA:network}
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      base-path: '/'
      exposure:
        include: health, prometheus
      path-mapping:
        # MetricsController maps to /v1/metrics -- the metrics API carries its own version, independent of the
        # connector interface version. Health is not mapped here: HealthControllerImpl already serves /v2/health.
        prometheus: v1/metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # The boundaries MetricsController.METRICS_CONFIG prescribes as http_server_latency_buckets_seconds.
      slo:
        http.server.requests: 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s
